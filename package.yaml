# Package definition for ripgrep

package_name: ripgrep
github_repo: BurntSushi/ripgrep
license: Unlicense
artifact_format: tar.gz
description: "ripgrep recursively searches directories for a regex pattern while respecting your gitignore"
license: Unlicense

# Build for all Debian suites and all supported architectures.

# Opt into native Ubuntu builds (builder >= v.0.1a29). Packages without
# these are served from the Debian suites via the alias fallback.
ubuntu_distributions:
  - jammy
  - noble
  - resolute
